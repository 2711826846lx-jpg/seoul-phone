:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f9f9ff}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:#111522;display:grid;place-items:center}.phone{position:relative;width:min(100vw,420px);height:min(100dvh,880px);overflow:hidden;background:linear-gradient(150deg,#302e57,#8b6b9e 48%,#cda7a5);border:5px solid #20202b;border-radius:38px;box-shadow:0 18px 70px #0008}.wall{position:absolute;inset:0;background:radial-gradient(ellipse at 72% 22%,#e6bad3 0,transparent 37%),radial-gradient(ellipse at 25% 82%,#5a79a5,transparent 52%);opacity:.75;pointer-events:none}.status{position:absolute;top:8px;left:0;right:0;display:flex;justify-content:space-between;padding:9px 27px;font-size:13px;font-weight:700;z-index:20;pointer-events:none}.island{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:94px;height:24px;border-radius:30px;background:#13131a;z-index:21}.screen{position:absolute;inset:0;padding:50px 16px 30px;overflow-y:auto;scrollbar-width:none}.screen::-webkit-scrollbar{display:none}.lock{display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;padding-top:85px;padding-bottom:78px}.locktime{font-size:76px;font-weight:200;letter-spacing:-4px}.lockdate{font-size:17px}.unlock{background:#ffffff32;color:white;border:1px solid #ffffff55;padding:15px 30px;border-radius:28px;font-size:15px;cursor:pointer}.home h1{font-size:18px;font-weight:600;margin:12px 5px 25px}.apps{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 8px;text-align:center}.app{background:none;border:0;color:white;cursor:pointer;font-size:11px;display:flex;align-items:center;flex-direction:column;gap:6px}.appicon{width:58px;height:58px;border-radius:16px;display:grid;place-items:center;font-size:28px;background:#fff;color:#333;box-shadow:0 3px 10px #0002}.appicon.chat{background:#f8df56}.appicon.ig{background:linear-gradient(40deg,#ffb43c,#ec4286,#813ed5);color:white}.appicon.sms{background:#50d66e;color:white}.appicon.call{background:#45c96b;color:white}.appicon.story{background:#222c4c;color:white}.appicon.save{background:#f6f3f7}.dock{position:absolute;bottom:25px;left:16px;right:16px;background:#ffffff36;backdrop-filter:blur(20px);padding:12px;border-radius:26px;display:flex;justify-content:space-around}.dock button{border:0;background:none;font-size:28px;cursor:pointer}.panel{background:#f6f5fa;color:#20202a}.bar{display:flex;align-items:center;gap:10px;margin-bottom:20px;position:sticky;top:-50px;background:#f6f5fa;padding:8px 0;z-index:2}.back{border:0;background:none;font-size:24px;color:#64639c;cursor:pointer}.bar strong{font-size:19px}.listitem{width:100%;display:flex;gap:12px;align-items:center;text-align:left;background:white;border:0;padding:14px;margin-bottom:9px;border-radius:16px;color:#222;cursor:pointer}.avatar{height:44px;width:44px;border-radius:50%;background:#d9d4e9;display:grid;place-items:center;font-size:22px;flex-shrink:0}.muted{font-size:12px;color:#85818e}.messages{display:flex;flex-direction:column;gap:12px;padding-bottom:100px}.bubble{padding:12px 14px;border-radius:16px;max-width:85%;font-size:14px;line-height:1.55;white-space:pre-wrap}.other{background:white;align-self:flex-start;border-bottom-left-radius:4px}.mine{background:#f8df56;align-self:flex-end;border-bottom-right-radius:4px}.choices{position:sticky;bottom:-30px;padding:12px 0 20px;background:#f6f5fa;display:grid;gap:8px}.choice{border:1px solid #dcd8e8;background:white;color:#343044;border-radius:13px;padding:12px;text-align:left;cursor:pointer;font-size:13px}.choice:disabled{opacity:.5}.feed{background:white;border-radius:17px;margin-bottom:15px;overflow:hidden}.feedhead{padding:13px;display:flex;gap:10px;align-items:center;font-weight:600}.photo{height:260px;background:linear-gradient(125deg,#b6c4d2,#e5bec3 50%,#8e89a9);display:grid;place-items:center;text-align:center;font-size:40px;color:#fff}.feedtext{padding:14px;font-size:14px;line-height:1.6}.pill{border:1px solid #d3cde1;border-radius:30px;padding:9px 13px;background:white;cursor:pointer;color:#3a344b}.section{background:white;border-radius:16px;padding:16px;margin:12px 0}.small{font-size:13px;line-height:1.65}.primary{border:0;background:#66598e;color:white;padding:13px 16px;border-radius:14px;cursor:pointer;width:100%;margin:7px 0}.danger{background:#ba5361}.storycard{border-left:4px solid #8575a9;background:white;border-radius:12px;padding:16px;margin:10px 0;line-height:1.6}.homebar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:110px;height:5px;border-radius:10px;background:#fff9;z-index:25;cursor:pointer}.panel~.homebar{background:#5555}.notice{font-size:12px;color:#6e6880;text-align:center}.tag{font-size:12px;color:#7d6c9a}.end{color:#a53f62;font-weight:600}

'use strict';
const KEY='seoul-phone-save-v1';const initial=()=>({unlocked:false,chapter:0,affection:0,flags:{},messages:[],smsRead:false,callState:'ringing',liked:false,storySeen:false,completed:false,bubbleRead:{},bubbleReplies:{},bubbleLikes:{}});let data;try{data={...initial(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{data=initial()};let page=data.unlocked?'home':'lock';let activeChat='johnny';let bubbleTab='inbox';
const chapters=[
 {title:'01 · 圣水洞的雨',text:'首尔，周五晚上。拍摄结束后，Lucy 走出圣水洞的摄影棚。经纪人已经离开，雨却突然下大了。手机震动，收到一条来自徐英浩的消息。',choices:[{label:'「还在圣水洞。外面下雨了ㅋㅋ」',reply:'아직 성수야. 밖에 비 와ㅋㅋ\n（还在圣水洞，外面下雨了哈哈）',answer:'우산 있어?\n（有伞吗？）',aff:1},{label:'「刚结束拍摄。你呢？」',reply:'촬영 이제 끝났어. 넌?\n（刚结束拍摄，你呢？）',answer:'나도 근처야. 이제 끝났어.\n（我也在附近，刚结束。）',aff:1},{label:'「嗯，怎么了？」',reply:'응, 왜?\n（嗯，怎么了？）',answer:'아니, 그냥. 오늘 촬영 있었잖아.\n（没什么，就是想起你今天有拍摄。）',aff:0},{label:'暂时不回复',reply:null,answer:null,aff:0}]},
 {title:'02 · 一条 Story',text:'回到车里，Instagram 出现一条新 Story。画面是一杯便利店热咖啡，定位在圣水洞附近。没有人物出镜。你可以决定是否留下痕迹。',choices:[{label:'给 Story 点赞',reply:null,aff:1,flag:'storyLike'},{label:'回复「咖啡好喝吗ㅋㅋ」',reply:'커피 맛있어?ㅋㅋ\n（咖啡好喝吗哈哈）',answer:'그냥 따뜻해서 샀어ㅋㅋ\n（只是因为暖和才买的哈哈）',aff:2},{label:'看完就退出',reply:null,aff:0},{label:'自己发一条雨夜 Story',reply:null,aff:0,flag:'postStory'}]},
 {title:'03 · 未接来电',text:'晚上十一点，手机屏幕亮起。来电显示：徐英浩。窗外的雨已经停了。',choices:[{label:'接听电话',reply:null,aff:2,flag:'answerCall'},{label:'挂断，发短信「不方便接」',reply:null,aff:0,flag:'rejectCall'},{label:'等铃声结束',reply:null,aff:0,flag:'missCall'},{label:'先静音，再决定',reply:null,aff:0,flag:'silenceCall'}]},
 {title:'04 · 下周的空档',text:'第二天上午，经纪人把下周的行程表发了过来。周二下午有两个小时空档。聊天列表里多了一条新消息：「下周有时间吗？」',choices:[{label:'「周二下午有一点时间。」',reply:'화요일 오후엔 잠깐 시간 있어.\n（周二下午有一点时间。）',answer:'그럼 그때 커피?\n（那到时候喝咖啡？）',aff:2},{label:'「这周太忙了，下次吧。」',reply:'이번 주 너무 바빠. 다음에 보자.\n（这周太忙了，下次见吧。）',answer:'알겠어. 스케줄 잘 끝내.\n（知道了，工作顺利。）',aff:0},{label:'「什么事？」',reply:'무슨 일인데?\n（什么事？）',answer:'별건 아니고. 시간 되면 잠깐 보려고.\n（没什么特别的，有空的话想见一面。）',aff:1},{label:'先问经纪人确认行程',reply:null,aff:0}]}
];
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch{alert('浏览器无法保存，请检查是否处于无痕模式。')}}function el(s){return document.getElementById(s)}function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function clock(){const d=new Date();el('clock').textContent=d.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false})}clock();setInterval(clock,30000);
function nav(p){page=p;render()}function header(name){return `<div class="bar"><button class="back" data-go="home">‹</button><strong>${name}</strong></div>`}function app(name,emoji,cls,to){return `<button class="app" data-go="${to}"><span class="appicon ${cls}">${emoji}</span>${name}</button>`}
function render(){const s=el('screen');s.className='screen '+(['lock','home'].includes(page)?page:'panel');let html='';if(page==='lock'){html=`<div><div class="lockdate">${new Date().toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'long'})}</div><div class="locktime">${new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false})}</div></div><div><p>SEOUL · PRIVATE PHONE</p><button class="unlock" data-action="unlock">向上滑动以解锁 ↑</button></div>`}else if(page==='home'){html=`<h1>SEOUL · Lucy's phone</h1><div class="apps">${app('Talk','💬','chat','chats')}${app('Instagram','◎','ig','instagram')}${app('Bubble','🫧','bbl','bubble')}${app('短信','✉','sms','sms')}${app('电话','☎','call','calls')}${app('剧情','✦','story','story')}${app('存档','⚙','save','settings')}</div><div class="dock"><button data-go="calls">📞</button><button data-go="chats">💬</button><button data-go="instagram">📷</button><button data-go="story">📖</button></div>`}else if(page==='chats'){html=header('Talk · 聊天')+`<button class="listitem" data-go="chat"><span class="avatar">🐈‍⬛</span><span><b>徐英浩</b><br><span class="muted">${escapeHTML(data.messages.at(-1)?.text?.slice(0,32)||'지금 어디야? · 你现在在哪？')}</span></span></button><button class="listitem" data-go="manager"><span class="avatar">📋</span><span><b>经纪人</b><br><span class="muted">明天 10:00 妆发，别迟到。</span></span></button>`}else if(page==='chat'){html=header('徐英浩')+`<div class="notice">今天 · 首尔</div><div class="messages"><div class="bubble other">지금 어디야?<br>（你现在在哪？）</div>${data.messages.map(m=>`<div class="bubble ${m.from==='me'?'mine':'other'}">${escapeHTML(m.text)}</div>`).join('')}</div><div class="choices"><button class="choice" data-go="story">前往剧情选择回复 →</button></div>`}else if(page==='manager'){html=header('经纪人')+`<div class="messages"><div class="bubble other">내일 10시 헤어 메이크업! 늦지 마.<br>（明天十点妆发，别迟到！）</div><div class="bubble mine">네~ 알겠습니다!<br>（好的，知道啦！）</div></div>`}else if(page==='instagram'){html=header('Instagram')+`<div class="section"><button class="pill" data-action="storyseen">◉ 查看 Story</button> <span class="muted">${data.storySeen?'已查看':'有新动态'}</span></div><div class="feed"><div class="feedhead"><span class="avatar">☕</span>seoul.night <span class="muted">· 圣水洞</span></div><div class="photo">☕<br><span style="font-size:17px">rainy night in seoul</span></div><div class="feedtext"><button class="pill" data-action="like">${data.liked?'♥ 已赞':'♡ 点赞'}</button><p>晚上的首尔，雨停了。</p><span class="muted">这是游戏中的虚构社交动态。</span></div></div>`}else if(page==='bubble'){const posts=[{id:'j1',name:'JOHNNY',icon:'🐈‍⬛',time:'今天 21:18',ko:'오늘 하루 어땠어? 밥은 먹었고? ㅎㅎ',zh:'今天过得怎么样？吃饭了吗？哈哈',choices:['먹었지ㅋㅋ 너는?（吃啦哈哈，你呢？）','오늘 좀 바빴어.（今天有点忙。）','비밀이야 ㅎㅎ（秘密哦哈哈）'],answers:['나도 먹었어ㅋㅋ（我也吃了哈哈）','고생했어. 푹 쉬어!（辛苦了，好好休息！）','뭐야ㅋㅋ 궁금하잖아（什么呀哈哈，好好奇）']},{id:'j2',name:'JOHNNY',icon:'🐈‍⬛',time:'昨天 23:06',ko:'오늘 연습 끝! 밖에 비 오네 ☔',zh:'今天练习结束！外面下雨了☔',choices:['조심히 들어가~（回去注意安全～）','서울도 비 와?（首尔也下雨吗？）'],answers:['응 고마워 :)（嗯，谢谢 :)）','응 꽤 많이 와（嗯，下得还挺大）']},{id:'y1',name:'YOUNGJI',icon:'🐻',time:'今天 18:42',ko:'야 루시!! 다음에 치킨 먹자ㅋㅋ',zh:'呀 Lucy！！下次一起吃炸鸡吧哈哈',choices:['좋아ㅋㅋ 언제?（好啊哈哈，什么时候？）','나중에 연락할게ㅎㅎ（之后联系你哈哈）'],answers:['시간 맞춰보자ㅋㅋ（找时间约吧哈哈）','오케이 기다릴게ㅋㅋ（OK等你哈哈）']}];const visible=posts.filter(x=>bubbleTab==='inbox'||(bubbleTab==='unread'?!data.bubbleRead?.[x.id]:data.bubbleReplies?.[x.id]!==undefined));html=header('🫧 Bubble')+`<div class="bbl-hero"><b style="font-size:22px">Bubble · 아티스트 메시지</b><div style="font-size:13px;margin-top:7px">艺人消息 · 模拟互动体验</div></div><div class="bbl-tabs"><button class="${bubbleTab==='inbox'?'selected':''}" data-btab="inbox">全部</button><button class="${bubbleTab==='unread'?'selected':''}" data-btab="unread">未读</button><button class="${bubbleTab==='replied'?'selected':''}" data-btab="replied">已回复</button></div>${visible.map(x=>`<div class="bbl-card"><div style="display:flex;align-items:center;gap:9px"><span class="avatar">${x.icon}</span><div><b>${x.name}</b><div class="muted">${x.time} ${data.bubbleRead?.[x.id]?'· 已读':'· ● 新消息'}</div></div></div><div class="bbl-msg">${x.ko}<br>（${x.zh}）</div><button class="pill" data-bread="${x.id}">${data.bubbleRead?.[x.id]?'✓ 已读':'标记已读'}</button> <button class="pill" data-blike="${x.id}">${data.bubbleLikes?.[x.id]?'♥ 已收藏':'♡ 收藏'}</button>${data.bubbleReplies?.[x.id]!==undefined?`<div class="bubble mine" style="margin:12px 0 0 auto">${escapeHTML(x.choices[data.bubbleReplies[x.id]])}</div><div class="bbl-msg">${x.answers[data.bubbleReplies[x.id]]}</div>`:`<p class="bbl-note">选择一条回复（仅模拟，不会发送给真实艺人）</p>${x.choices.map((c,i)=>`<button class="bbl-reply" data-breply="${x.id}" data-option="${i}">${escapeHTML(c)}</button>`).join('')}`}</div>`).join('')||'<div class="section">这里暂时没有消息。</div>'}<p class="bbl-note">这是非官方粉丝创作的虚构 Bubble 页面，不连接任何真实艺人账户或付费服务。消息与回复均保存在本地游戏存档中。</p>`}else if(page==='sms'){html=header('短信')+`<div class="section small"><b>经纪人 · 日程提醒</b><p>Lucy，明天上午十点到公司，下午有录音。请确认。</p><button class="pill" data-action="sms">${data.smsRead?'✓ 已读':'标记已读'}</button></div>`}else if(page==='calls'){html=header('电话')+`<div class="section" style="text-align:center"><div style="font-size:55px">☎</div><h2>徐英浩</h2><p>${data.callState==='ringing'?'剧情来电 · 等待你的决定':data.callState==='answered'?'已接听 · 通话结束':data.callState==='declined'?'未接来电':'尚无新来电'}</p><button class="primary" data-action="answer">接听</button><button class="primary danger" data-action="decline">拒接</button><p class="muted">通话以文字剧情模拟，不会拨打真实电话。</p></div>`}else if(page==='story'){const ch=chapters[data.chapter];html=header('互动剧情')+`<div class="section"><span class="tag">SEOUL STORY · 第 ${Math.min(data.chapter+1,chapters.length)} / ${chapters.length} 章</span><h2>${ch?ch.title:'已完成 · 第一季'}</h2><p class="small">${ch?ch.text:'故事的第一段已经结束。你可以保留存档，或从设置里重新开始。'}</p></div><div class="section small">关系温度：${'♥'.repeat(Math.min(8,Math.max(1,data.affection+1)))} <span class="muted">(${data.affection})</span><br>选择会影响后续消息与关系温度。</div>${ch?`<div class="choices">${ch.choices.map((c,i)=>`<button class="choice" data-choice="${i}">${String.fromCharCode(65+i)} · ${escapeHTML(c.label)}</button>`).join('')}</div>`:`<button class="primary" data-go="home">返回桌面</button>`}`}else if(page==='settings'){html=header('设置 · 存档')+`<div class="section small"><h3>本地自动存档</h3><p>当前进度：第 ${Math.min(data.chapter+1,chapters.length)} 章<br>关系温度：${data.affection}</p><p>存档保存在当前浏览器的 localStorage 中。换设备、清除网站数据或使用无痕模式可能导致丢失。</p><button class="primary" data-action="export">导出存档 JSON</button><label class="primary" style="display:block;text-align:center">导入存档 JSON<input id="import" type="file" accept="application/json,.json" style="display:none"></label><button class="primary danger" data-action="reset">清空进度重新开始</button></div>`}s.innerHTML=html;s.scrollTop=0}
function choose(i){const ch=chapters[data.chapter];if(!ch)return;const c=ch.choices[i];if(!c)return;if(c.reply)data.messages.push({from:'me',text:c.reply});if(c.answer)data.messages.push({from:'other',text:c.answer});if(c.flag)data.flags[c.flag]=true;if(c.flag==='storyLike')data.liked=true;if(c.flag==='postStory')data.flags.posted=true;if(c.flag==='answerCall')data.callState='answered';if(c.flag==='rejectCall'||c.flag==='missCall')data.callState='declined';data.affection+=c.aff||0;data.chapter++;data.completed=data.chapter>=chapters.length;save();render()}
document.addEventListener('click',e=>{const t=e.target.closest('[data-go],[data-action],[data-choice],[data-btab],[data-bread],[data-blike],[data-breply]');if(!t)return;if(t.dataset.btab){bubbleTab=t.dataset.btab;render();return}if(t.dataset.bread){data.bubbleRead??={};data.bubbleRead[t.dataset.bread]=true;save();render();return}if(t.dataset.blike){data.bubbleLikes??={};data.bubbleLikes[t.dataset.blike]=!data.bubbleLikes[t.dataset.blike];save();render();return}if(t.dataset.breply){data.bubbleReplies??={};data.bubbleRead??={};data.bubbleReplies[t.dataset.breply]=Number(t.dataset.option);data.bubbleRead[t.dataset.breply]=true;save();render();return}if(t.dataset.go){nav(t.dataset.go);return}if(t.dataset.choice!==undefined){choose(Number(t.dataset.choice));return}const a=t.dataset.action;if(a==='unlock'){data.unlocked=true;save();nav('home')}if(a==='like'){data.liked=!data.liked;save();render()}if(a==='storyseen'){data.storySeen=true;save();render()}if(a==='sms'){data.smsRead=true;save();render()}if(a==='answer'){data.callState='answered';save();render()}if(a==='decline'){data.callState='declined';save();render()}if(a==='reset'&&confirm('确定清除所有剧情进度吗？')){data=initial();save();nav('lock')}if(a==='export'){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download='seoul-phone-save.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}});
document.addEventListener('change',async e=>{if(e.target.id!=='import')return;try{const parsed=JSON.parse(await e.target.files[0].text());if(!parsed||typeof parsed.chapter!=='number'||!Array.isArray(parsed.messages)||!Array.isArray(parsed.messages)||parsed.chapter<0||parsed.chapter>chapters.length||parsed.messages.length>5000)throw Error('存档格式不正确');data={...initial(),...parsed};save();nav('home');alert('导入成功')}catch(err){alert('导入失败：'+err.message)}});el('homebar').addEventListener('click',()=>{if(data.unlocked)nav('home')});render();
</script></body></html>
