else if(page==='activity'){h=head('首尔 · 今日生活')+`<div class="card"><b>模拟第 ${data.sim.day} 天 · 首尔</b><p class="hint">角色根据剧情进度、模拟时间主动发消息。游戏打开时会更新；关闭网页不会后台推送。</p><button class="btn" data-act="nextday">推进一天（演示）</button></div><div class="schedule"><b>今日行程</b><div class="eventline">10:00 · 헤어 & 메이크업 / 妆发</div><div class="eventline">15:00 · 리허설 / 彩排</div><div class="eventline">17:00 · 촬영 / 拍摄</div><div class="eventline">21:00 · 귀가 / 回家</div></div><h3>通知与动态</h3>${data.sim.events.map(e=>`<div class="card"><b>${esc(e.title)}</b><div class="sub">第${e.day}天 · ${esc(e.at)}</div><p>${esc(e.detail)}</p></div>`).join('')||'<p class="hint">继续使用手机，稍后会出现新消息。</p>'}`}
else if(['kakao','sms','wechat'].includes(page)){service=page;let title={kakao:'KakaoTalk',sms:'信息',wechat:'微信'}[service];h=head(title,`<button class="iconbtn" data-act="addcontact">＋</button>`)+`<input type="search" id="search" placeholder="搜索联系人" autocomplete="off"><div id="contactlist">${contactList()}</div><p class="hint">点击右上角＋可以添加联系人；进入聊天后可自由输入文字。消息均为本地虚构模拟。</p>`}
else if(page==='conversation'){markRead(service,who);let msgs=thread(service,who);h=head(cname(service,who))+`<div class="caption">${service==='kakao'?'카카오톡':service==='wechat'?'微信':'iMessage'} · 虚构对话</div><div class="chatlog ${service}">${msgs.map(m=>`<div class="msg ${m.from==='me'?'me':'them'}">${esc(m.text)}</div>`).join('')}</div><form id="chatForm" class="composer"><textarea id="chatInput" rows="1" maxlength="1000" placeholder="输入消息..."></textarea><button type="submit">发送</button></form>`}
else if(page==='bubble'){seedFan();h=head('🫧 Bubble · Artist')+`<div class="bubblehero"><b>Lucy · 아티스트</b><p style="margin:5px 0">艺人端 · 粉丝交流空间</p><span class="muted">${data.fanInbox.length} 条模拟粉丝来信 · 仅本地演示</span></div><div class="tabs"><button class="${btab==='inbox'?'sel':''}" data-btab="inbox">粉丝来信</button><button class="${btab==='post'?'sel':''}" data-btab="post">发布 Bubble</button><button class="${btab==='poll'?'sel':''}" data-btab="poll">投票</button></div>${btab==='inbox'?`<button class="chip" data-act="newfan">＋ 模拟收到新消息</button>${data.fanInbox.map(f=>`<div class="fan"><b>${esc(f.from)}</b> <span class="muted">${esc(f.at)}</span><div style="margin-top:7px;white-space:pre-wrap">${esc(f.text)}</div></div>`).join('')}`:btab==='post'?`<div class="card"><h3>发送给粉丝</h3><form id="bubbleForm"><textarea id="bubbleText" rows="4" maxlength="1200" placeholder="오늘 뭐 했어? 💗  今天做了什么？" style="width:100%;padding:12px;border:1px solid #ddd;border-radius:12px"></textarea><p><label class="chip">📷 添加图片 <input id="bubbleFile" type="file" accept="image/*" style="display:none"></label></p><div id="bubblePreview"></div><button class="btn full" type="submit">发送 Bubble</button></form></div><h3>已发送</h3>${data.bubblePosts.map(p=>`<div class="card"><span class="muted">${esc(p.at)} · 发给粉丝</span><p style="white-space:pre-wrap">${esc(p.text)}</p>${p.image?`<img class="preview" src="${p.image}">`:''}</div>`).join('')}`:`<div class="card"><h3>发起粉丝投票</h3><form id="pollForm"><input id="pollQuestion" type="text" maxlength="100" placeholder="今天晚餐吃什么？" required><p><input id="pollA" type="text" maxlength="50" placeholder="选项 A" required></p><p><input id="pollB" type="text" maxlength="50" placeholder="选项 B" required></p><button class="btn full">发布投票</button></form></div>${data.polls.map(p=>`<div class="card"><b>${esc(p.question)}</b>${p.options.map((o,i)=>`<button class="pollopt" data-vote="${p.id}" data-opt="${i}">${esc(o)} · ${p.votes[i]}票</button>`).join('')}<span class="hint">模拟粉丝投票，点击选项可增加一票</span></div>`).join('')}`}<p class="hint">这是基于公开可见交互概念设计的非官方艺人端模拟，不是 LYSN 的真实内部界面或服务。粉丝消息为离线自动生成，不能发送给真实粉丝。</p>`}
else if(page==='instagram'){h=head('Instagram',`<button class="iconbtn" data-act="igcreate">⊞</button>`)+`<div class="row" style="gap:18px;margin-bottom:12px"><button class="iconbtn" data-act="igstory"><span class="avatar storyring">🌷</span><span class="muted">你的 Story</span></button><button class="iconbtn" data-act="igstory"><span class="avatar storyring">🐈‍⬛</span><span class="muted">johnny</span></button><button class="iconbtn" data-act="igstory"><span class="avatar storyring">🐻</span><span class="muted">youngji</span></button></div><div class="tabs"><button class="${tab==='feed'?'sel':''}" data-igtab="feed">首页</button><button class="${tab==='profile'?'sel':''}" data-igtab="profile">个人主页</button><button class="${tab==='dm'?'sel':''}" data-igtab="dm">私信</button></div>${tab==='dm'?`<button class="item" data-igdm="johnny"><span class="avatar">🐈‍⬛</span><div>johnny · 私信 <div class="sub">点击进入模拟对话</div></div></button><button class="item" data-igdm="youngji"><span class="avatar">🐻</span><div>youngji · 私信</div></button>`:tab==='profile'?`<div class="card"><div class="row"><span class="avatar">🌷</span><div><b>lucy.official</b><p class="muted">Solo Artist · Seoul</p></div></div><p>帖子 ${data.igPosts.length} · 粉丝 18.2万（虚构） · 关注 128</p><button class="chip" data-act="igcreate">＋ 发布新帖</button> <label class="chip">📷 上传帖子图片<input id="igPhoto" type="file" accept="image/*" hidden></label></div>${igCards(data.igPosts)}`:igCards([{id:'sample1',name:'johnny',text:'rainy night in seoul ☕',emoji:'☕',at:'今天 21:30'},{id:'sample2',name:'youngji',text:'오늘도 수고했어! 🐻',emoji:'🐻',at:'昨天'},...data.igPosts])}`}
else if(page==='igchat'){h=head(who==='johnny'?'johnny':'youngji')+`<div class="chatlog">${thread('kakao','ig_'+who).map(m=>`<div class="msg ${m.from==='me'?'me':'them'}">${esc(m.text)}</div>`).join('')}</div><form id="igChatForm" class="composer"><textarea id="igChatText" placeholder="发送私信" rows="1"></textarea><button>发送</button></form>`}
else if(page==='calls'){h=head('电话')+`<div class="card" style="text-align:center"><div style="font-size:55px">📞</div><h2>徐英浩</h2><p>${data.callState==='ringing'?'剧情模拟来电':data.callState==='answered'?'已接听 · 文字通话结束':'未接来电'}</p><div class="two"><button class="btn" data-act="answer">接听</button><button class="btn danger" data-act="decline">拒接</button></div><p class="hint">不会拨打真实电话或播放真人语音。</p></div>`}
else if(page==='story'){let c=chapters[data.chapter];h=head('互动剧情')+`<div class="card"><span class="muted">第 ${Math.min(data.chapter+1,chapters.length)} / ${chapters.length} 章</span><h2>${esc(c?.title||'第一季结束')}</h2><p style="line-height:1.8">${esc(c?.text||'第一季剧情已结束，仍可继续使用手机内的社交功能。')}</p></div><div class="card">关系温度：♥ ${data.affection}</div>${c?c.choices.map((x,i)=>`<button class="storychoice" data-choice="${i}">${String.fromCharCode(65+i)} · ${esc(x.label)}</button>`).join(''):''}`}
else if(page==='settings'){h=head('存档与设置')+`<div class="card"><h3>自动存档</h3><p>第 ${Math.min(data.chapter+1,chapters.length)} 章 · 关系温度 ${data.affection}</p><p class="hint">所有聊天、发帖、投票保存在本设备浏览器。清除浏览器数据可能丢失；大图可能超出存储空间。</p><button class="btn full" data-act="export">导出 JSON 存档</button><p><label class="btn full" style="display:block;text-align:center">导入 JSON 存档<input id="import" type="file" accept=".json,application/json" hidden></label></p><button class="btn danger full" data-act="reset">清空所有进度</button></div>`}s.innerHTML=h;s.scrollTop=0}
function contactList(){return (data.contacts[service]||[]).map(c=>{let last=thread(service,c.id).at(-1);return `<button class="item" data-contact="${esc(c.id)}"><span class="avatar">${cemoji(c.id)}</span><div class="grow"><b>${esc(c.name)}</b> ${unread(service,c.id)?`<span class="dot">${unread(service,c.id)}</span>`:''}<div class="sub">${esc(last?.text?.slice(0,40)||'点击开始聊天')}</div></div><span class="muted">${esc(last?.at||'')}</span></button>`}).join('')}
function igCards(posts){return posts.map(p=>{let liked=data.igLikes[p.id],comments=data.igComments[p.id]||[];return `<div class="igcard"><div class="ighead"><span class="avatar">${p.name==='johnny'?'🐈‍⬛':p.name==='youngji'?'🐻':'🌷'}</span><div><b>${esc(p.name||'lucy.official')}</b><div class="muted">${esc(p.at||'刚刚')} · Seoul</div></div></div>${p.image?`<img class="photo" src="${p.image}" alt="发布的图片">`:`<div class="photo">${esc(p.emoji||'🌷')}</div>`}<div class="igbuttons"><button data-like="${p.id}">${liked?'❤️':'♡'}</button><button data-comment="${p.id}">♧</button><button data-share="${p.id}">➤</button></div><b>${liked?'你和其他人赞了':'喜欢这条动态'}</b><p>${esc(p.text)}</p>${comments.map(c=>`<p class="muted">${esc(c)}</p>`).join('')}<button class="chip" data-comment="${p.id}">添加评论</button></div>`}).join('')}
function choose(i){let c=chapters[data.chapter]?.choices[i];if(!c)return;if(c.reply)append('kakao','johnny','me',c.reply);if(c.answer)append('kakao','johnny','them',c.answer);if(c.flag)data.flags[c.flag]=true;if(c.flag==='answerCall')data.callState='answered';if(c.flag==='rejectCall'||c.flag==='missCall')data.callState='declined';data.affection+=c.aff||0;data.chapter++;save();render()}
function addContact(){let name=prompt('请输入联系人昵称（可使用韩文）');if(!name?.trim())return;name=name.trim().slice(0,40);let id='custom_'+Date.now();data.contacts[service].push({id,name});save();render()}
function imageFile(input,done){let file=input?.files?.[0];if(!file){done(null);return}if(!file.type.startsWith('image/')){alert('请选择图片');return}if(file.size>5*1024*1024){alert('图片不能超过 5MB');return}let im=new Image();let url=URL.createObjectURL(file);im.onload=()=>{let canvas=document.createElement('canvas');let ratio=Math.min(1,1000/Math.max(im.width,im.height));canvas.width=Math.max(1,Math.round(im.width*ratio));canvas.height=Math.max(1,Math.round(im.height*ratio));canvas.getContext('2d').drawImage(im,0,0,canvas.width,canvas.height);URL.revokeObjectURL(url);done(canvas.toDataURL('image/jpeg',.68))};im.onerror=()=>{URL.revokeObjectURL(url);alert('无法读取图片')};im.src=url}
function createIG(){let text=prompt('发布 Instagram 帖子：输入配文');if(text===null)return;let id='ig'+Date.now();data.igPosts.unshift({id,name:'lucy.official',text:text.slice(0,1500),emoji:'🌆',at:stamp()});save();tab='profile';render()}
document.addEventListener('click',e=>{let t=e.target.closest('[data-nav],[data-act],[data-contact],[data-btab],[data-igtab],[data-igdm],[data-like],[data-comment],[data-share],[data-vote],[data-choice]');if(!t)return;let d=t.dataset;if(d.nav){nav(d.nav);return}if(d.contact){who=d.contact;markRead(service,who);nav('conversation');return}if(d.btab){btab=d.btab;render();return}if(d.igtab){tab=d.igtab;render();return}if(d.igdm){who=d.igdm;nav('igchat');return}if(d.like){data.igLikes[d.like]=!data.igLikes[d.like];save();render();return}if(d.comment){let c=prompt('输入评论');if(c?.trim()){(data.igComments[d.comment]??=[]).push('lucy.official: '+c.trim().slice(0,500));save();render()}return}if(d.share){alert('已模拟分享到 Story（仅本地演示）');data.igStory.push({id:d.share,at:stamp()});save();return}if(d.vote){let p=data.polls.find(x=>x.id===d.vote);if(p){p.votes[Number(d.opt)]++;save();render()}return}if(d.choice!==undefined){choose(Number(d.choice));return}switch(d.act){case'unlock':data.unlocked=true;save();nav('home');break;case'addcontact':addContact();break;case'newfan':seedFan(true);render();break;case'nextday':data.sim.activity+=240000;data.sim.day=1+Math.floor(data.sim.activity/240000);data.sim.nextAmbient=0;tickSimulation();render();break;case'answer':data.callState='answered';save();render();break;case'decline':data.callState='declined';save();render();break;case'igcreate':createIG();break;case'igstory':alert('Story · 这是模拟的限时动态。');data.storySeen=true;save();break;case'reset':if(confirm('确定清除全部游戏进度吗？')){data=init();save();nav('lock')}break;case'export':{let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='seoul-phone-save.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);break}}});
document.addEventListener('submit',e=>{e.preventDefault();let id=e.target.id;if(id==='chatForm'){let v=$('chatInput').value.trim();if(!v)return;append(service,who,'me',v);scheduleReply(service,who);render()}else if(id==='igChatForm'){let v=$('igChatText').value.trim();if(v){append('kakao','ig_'+who,'me',v);render()}}else if(id==='bubbleForm'){let v=$('bubbleText').value.trim(),f=$('bubbleFile');if(!v&&!f.files.length){alert('请填写文字或选择图片');return}imageFile(f,image=>{data.bubblePosts.unshift({id:'p'+Date.now(),text:v,image,at:stamp()});save();render()})}else if(id==='pollForm'){let q=$('pollQuestion').value.trim(),a=$('pollA').value.trim(),b=$('pollB').value.trim();if(q&&a&&b){data.polls.unshift({id:'p'+Date.now(),question:q,options:[a,b],votes:[0,0]});save();render()}}});
document.addEventListener('change',async e=>{if(e.target.id==='igPhoto'){imageFile(e.target,image=>{if(!image)return;let caption=prompt('Instagram 配文（可留空）')||'';data.igPosts.unshift({id:'ig'+Date.now(),name:'lucy.official',text:caption.slice(0,1500),image,at:stamp()});save();render()})}if(e.target.id==='bubbleFile'){let file=e.target.files?.[0];$('bubblePreview').textContent=file?'已选择：'+file.name:''}if(e.target.id==='import'){try{let p=JSON.parse(await e.target.files[0].text());if(!p||!Number.isInteger(p.chapter)||p.chapter<0||p.chapter>chapters.length||!Array.isArray(p.messages))throw Error('存档格式错误');data={...init(),...p};data.threads??={kakao:{},sms:{},wechat:{}};data.contacts??=init().contacts;save();nav('home');alert('导入成功')}catch(err){alert('导入失败：'+err.message)}}});document.addEventListener('input',e=>{if(e.target.id==='search'){let q=e.target.value.toLowerCase();document.querySelectorAll('#contactlist .item').forEach(x=>x.hidden=!x.textContent.toLowerCase().includes(q))}});
$('homebar').onclick=()=>{if(data.unlocked)nav('home')};function clock(){$('clock').textContent=stamp()}clock();setInterval(clock,30000);setInterval(tickSimulation,5000);tickSimulation();setInterval(()=>{if(page==='bubble'&&btab==='inbox'){let before=data.fanInbox.length;seedFan();if(data.fanInbox.length!==before)render()}},30000);render();
</script></body></html>
